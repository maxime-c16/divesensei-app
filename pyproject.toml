[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "divesensei"
version = "0.1.0"
description = "Local-first dive review workspace with audio-first detection and review-first exports."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "DiveSensei" }
]
dependencies = [
  "numpy",
  "opencv-python",
]
keywords = ["computer-vision", "audio", "video", "sports", "diving", "desktop-app"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://maxime-c16.github.io/divesensei-app/"
Documentation = "https://maxime-c16.github.io/divesensei-app/"
Issues = "https://github.com/maxime-c16/divesensei-app/issues"
Repository = "https://github.com/maxime-c16/divesensei-app"

[project.scripts]
divesensei = "divesensei.cli:main"
divesensei-regress = "divesensei.app.regression:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
