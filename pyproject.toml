[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "divesensei"
version = "0.1.0"
description = "Production-ready audio-first dive detection, extraction, and UI metadata pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "DiveSensei" }
]
dependencies = [
  "numpy",
  "opencv-python",
]
keywords = ["computer-vision", "audio", "video", "sports", "diving", "desktop-app"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/your-org/divesensei"
Documentation = "https://github.com/your-org/divesensei/tree/main/docs"
Issues = "https://github.com/your-org/divesensei/issues"

[project.scripts]
divesensei = "divesensei.cli:main"
divesensei-regress = "divesensei.app.regression:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

