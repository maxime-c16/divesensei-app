<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DiveSensei logo</title>
  <desc id="desc">A circular sonar mark with a descending diver stroke and splash ripples.</desc>
  <defs>
    <linearGradient id="ring" x1="44" y1="36" x2="208" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FDAFF"/>
      <stop offset="1" stop-color="#2D90C9"/>
    </linearGradient>
    <linearGradient id="dive" x1="138" y1="68" x2="112" y2="182" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EBF6FF"/>
      <stop offset="1" stop-color="#7FDAFF"/>
    </linearGradient>
    <filter id="glow" x="24" y="24" width="208" height="208" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="82" stroke="url(#ring)" stroke-width="14" opacity="0.9"/>
  <circle cx="128" cy="128" r="54" stroke="#9AB2C4" stroke-opacity="0.2" stroke-width="8"/>

